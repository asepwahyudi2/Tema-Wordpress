name: Deploy Theme to WordPress

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Secrets Presence
        run: |
          echo "Checking if secrets are populated (true/false):"
          if [ -n "${{ secrets.FTP_SERVER }}" ]; then echo "FTP_SERVER is set"; else echo "FTP_SERVER is EMPTY"; fi
          if [ -n "${{ secrets.FTP_USERNAME }}" ]; then echo "FTP_USERNAME is set"; else echo "FTP_USERNAME is EMPTY"; fi
          if [ -n "${{ secrets.FTP_PASSWORD }}" ]; then echo "FTP_PASSWORD is set"; else echo "FTP_PASSWORD is EMPTY"; fi

      - name: Sync Files to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README*.txt
